# ============================================================
# PHASE H — FROZEN FORWARD VALIDATION (do not modify during H)
# ============================================================
phase_h:
  enabled: true
  automatic_retraining: false
  tf_enabled: false
  mr_fail:
    threshold: 0.45
    threshold_locked: true
  us500:
    mr_mode: "RESEARCH_ONLY"
  runner:
    standalone_entry: false
    research_exit_methods: ["OSC_CROSS", "HYBRID"]
  execution:
    broker_enabled: false
    manual_only: true
  model_freeze:
    enabled: true

asset_classes:
  GOLD: METALS
  USDJPY: FX
  EURCAD: FX
  US500: INDEX
  BTCUSD: CRYPTO
  ETHUSD: CRYPTO

class_policy:
  METALS: {mr_enabled: true, runner_research: true}
  FX: {mr_enabled: true, runner_research: true}
  CRYPTO: {mr_enabled: true, runner_research: true}
  INDEX: {mr_enabled: false, research_only: true}

forward_validation:
  minimum_calendar_days: 28
  preferred_calendar_days: 56
  minimum_mr_candidates: 30
  preferred_mr_candidates: 60
  minimum_runner_events: 20
  preferred_runner_events: 40
