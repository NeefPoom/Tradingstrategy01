name: Update trading dashboard

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "data/**"
      - "reports/**"
      - "docs/**"
      - "PHASE_H_STATUS.md"
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trading-dashboard
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update prices and reports
        run: |
          python scripts/update_prices.py
          python scripts/check_market_open_completeness.py
          python scripts/backfill_market_open_prices.py
          python scripts/check_market_open_completeness.py
          python scripts/check_price_quality.py
          python scripts/observe_latest.py
          python scripts/resolve_forward_outcomes.py
          python scripts/score_all_latest.py
          python scripts/make_trade_plan.py
          python scripts/forward_mr_gate_report.py
          python scripts/forward_runner_report.py
          python scripts/forward_calibration_report.py
          python scripts/generate_phase_h_status.py
          python scripts/build_static_dashboard.py

      - name: Run tests
        run: pytest

      - name: Commit updated research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports docs PHASE_H_STATUS.md
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update scheduled trading dashboard"
            git push
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
